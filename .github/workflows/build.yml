name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Diagnostics
        continue-on-error: true
        run: |
          echo "=== Node ==="
          node --version
          echo "=== npm ==="
          npm --version
          echo "=== Expo ==="
          npx expo --version
          echo "=== expo-doctor ==="
          npx expo-doctor || true
          echo "=== packages ==="
          npm ls expo react react-native --depth=0

      - name: Build Android APK
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
